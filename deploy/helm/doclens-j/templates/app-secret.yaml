{{- if not .Values.app.database.existingSecret -}}
{{- $secretName := include "doclens-j.appSecretName" . -}}
{{- $databasePassword := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $databasePassword = .Values.postgresql.password -}}
{{- if not $databasePassword -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existingSecret (hasKey $existingSecret.data .Values.app.database.passwordKey) -}}
{{- $databasePassword = index $existingSecret.data .Values.app.database.passwordKey | b64dec -}}
{{- else -}}
{{- $databasePassword = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- $databasePassword = required "app.database.password is required when postgresql.enabled=false and app.database.existingSecret is empty" .Values.app.database.password -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "doclens-j.labels" . | nindent 4 }}
type: Opaque
stringData:
  DOCLENS_DB_PASSWORD: {{ $databasePassword | quote }}
  DOCLENS_GATEWAY_SECRET: {{ .Values.app.gatewayAuth.secret | quote }}
{{- end }}
