{{- if not .Values.app.database.existingSecret -}}
{{- $databasePassword := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $databasePassword = default (randAlphaNum 32) .Values.postgresql.password -}}
{{- else -}}
{{- $databasePassword = required "app.database.password is required when postgresql.enabled=false and app.database.existingSecret is empty" .Values.app.database.password -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doclens-j.appSecretName" . }}
  labels:
    {{- include "doclens-j.labels" . | nindent 4 }}
type: Opaque
stringData:
  DOCLENS_DB_PASSWORD: {{ $databasePassword | quote }}
  DOCLENS_GATEWAY_SECRET: {{ .Values.app.gatewayAuth.secret | quote }}
{{- end }}
