services:
  doclens:
    image: "${DOCLENS_IMAGE_REPOSITORY:-doclens}:${DOCLENS_IMAGE_TAG:-amd64}"
    container_name: "${DOCLENS_CONTAINER_NAME:-doclens-all-in-one}"
    restart: unless-stopped
    ports:
      - "${DOCLENS_SERVER_PORT:-10003}:${DOCLENS_SERVER_PORT:-10003}"
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      DOCLENS_SERVER_PORT: "${DOCLENS_SERVER_PORT:-10003}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-doclens}"
      POSTGRES_USER: "${POSTGRES_USER:-doclens}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-replace-with-strong-password}"
      DOCLENS_DB_URL: "${DOCLENS_DB_URL:-}"
      DOCLENS_DB_USERNAME: "${DOCLENS_DB_USERNAME:-}"
      DOCLENS_DB_PASSWORD: "${DOCLENS_DB_PASSWORD:-}"
      DOCLENS_DB_DRIVER: "${DOCLENS_DB_DRIVER:-org.postgresql.Driver}"
      DOCLENS_STORAGE_ROOT: "${DOCLENS_STORAGE_ROOT:-/var/lib/doclens/storage}"
      DOCLENS_WORKER_ID: "${DOCLENS_WORKER_ID:-doclens-worker-1}"
      DOCLENS_PADDLE_OCR_ENDPOINT: "${DOCLENS_PADDLE_OCR_ENDPOINT:-http://paddle-ocr:8080/ocr}"
      DOCLENS_PADDLE_OCR_NODE_NAME: "${DOCLENS_PADDLE_OCR_NODE_NAME:-paddle-primary}"
      DOCLENS_PADDLE_OCR_NODE_HOST: "${DOCLENS_PADDLE_OCR_NODE_HOST:-paddle-ocr}"
      DOCLENS_PADDLE_OCR_NODE_PORT: "${DOCLENS_PADDLE_OCR_NODE_PORT:-8080}"
      DOCLENS_WORD_CONVERSION_COMMAND: "${DOCLENS_WORD_CONVERSION_COMMAND:-/usr/bin/soffice}"
      DOCLENS_GATEWAY_SECRET: "${DOCLENS_GATEWAY_SECRET:-replace-with-gateway-secret}"
      DOCLENS_GATEWAY_PRINCIPAL: "${DOCLENS_GATEWAY_PRINCIPAL:-dashboard-admin}"
      DOCLENS_GATEWAY_PARTITION: "${DOCLENS_GATEWAY_PARTITION:-default}"
      DOCLENS_CONFIG_DIR: /opt/doclens/config
      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/opt/doclens/conf/,optional:file:/opt/doclens/config/"
    volumes:
      - doclens-postgresql-data:/var/lib/postgresql/data
      - doclens-storage:/var/lib/doclens/storage
      - ./docker/examples/all-in-one:/opt/doclens/config:ro

volumes:
  doclens-postgresql-data:
  doclens-storage:
