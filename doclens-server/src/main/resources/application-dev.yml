spring:
  datasource:
    url: ${DOCLENS_DB_URL:jdbc:postgresql://localhost:5432/doclens}
    username: ${DOCLENS_DB_USERNAME:doclens}
    password: ${DOCLENS_DB_PASSWORD:doclens}
    driver-class-name: ${DOCLENS_DB_DRIVER:org.postgresql.Driver}

doclens:
  storage-root: ./var/storage
  worker-id: local-worker
  paddle-ocr:
    endpoint: ${DOCLENS_PADDLE_OCR_ENDPOINT:}
  word-conversion:
    command: /opt/homebrew/bin/soffice
