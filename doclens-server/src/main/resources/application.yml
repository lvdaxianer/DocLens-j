spring:
  application:
    name: doclens-j
  datasource:
    url: jdbc:h2:file:./var/db/doclens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  port: 10003

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

doclens:
  storage-root: ./var/storage
  auto-process-on-upload: true
  worker-id: local-worker
  adapter:
    default-key: paddle_ocr
  ocr:
    default-routing-mode: GLOBAL_LOAD_BALANCE
    load-balance-strategy: weighted-idle
    idle-factor: 0.7
    weight-factor: 0.3
    top-bucket-threshold: 0.15
    request-retry-times: 3
    probe-interval-seconds: 5
    health-check-timeout-seconds: 5
    failure-threshold: 3
    circuit-open-seconds: 86400
    recovery-success-threshold: 3
    manual-recovery-attempts: 3
    specific-node-fallback-enabled: false
  paddle-ocr:
    enabled: true
    endpoint: ${DOCLENS_PADDLE_OCR_ENDPOINT:http://10.100.30.215:8080/ocr}
    timeout-seconds: 600
    visualize: false
    bootstrap-nodes:
      - name: paddle-215
        host: 10.100.30.215
        port: 8080
        enabled: true
        participate-global: true
        weight: 50
        max-concurrency: 10
  page-task-worker:
    batch-size: 10
    lock-seconds: 630
    pool-size: 10
    queue-capacity: 200
    recovery-limit: 32
    interval-millis: 500
  extraction:
    ocr-concurrency: 4
  pdf-render:
    dpi: 36
    image-format: png
  word-conversion:
    command: /opt/homebrew/bin/soffice
    timeout-seconds: 60
  callback:
    max-retries: 3
    timeout-seconds: 10
  clients:
    credentials:
      - client-id: local-demo
        source-app: dashboard
        tenant-key: local
        api-key: ${DOCLENS_LOCAL_CREDENTIAL_KEY:}
        rate-limits:
          dashboard-read:
            qps: 20
            burst: 40
          detail-read:
            qps: 10
            burst: 20
          upload-write:
            qps: 1
            burst: 3
          ocr-mutation:
            qps: 0.5
            burst: 2
          config-mutation:
            qps: 0.2
            burst: 1
          admin-health:
            qps: 5
            burst: 10
  traffic:
    enabled: true
    anonymous-enabled: false
    default-limits:
      dashboard-read:
        qps: 10
        burst: 20
      detail-read:
        qps: 5
        burst: 10
      upload-write:
        qps: 0.5
        burst: 2
      ocr-mutation:
        qps: 0.2
        burst: 1
      config-mutation:
        qps: 0.1
        burst: 1
      admin-health:
        qps: 2
        burst: 5
    global-protection:
      enabled: true
      max-in-flight: 100
