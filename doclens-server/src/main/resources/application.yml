spring:
  application:
    name: doclens-j
  datasource:
    url: jdbc:h2:file:./var/db/doclens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  port: 10003

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

doclens:
  storage-root: ./var/storage
  auto-process-on-upload: true
  worker-id: local-worker
  adapter:
    default-key: paddle_ocr
  ocr:
    default-routing-mode: GLOBAL_LOAD_BALANCE
    load-balance-strategy: least-inflight
    request-retry-times: 3
    health-check-interval-seconds: 30
    health-check-timeout-seconds: 5
    health-failure-threshold: 3
    recovery-success-threshold: 2
    specific-node-fallback-enabled: false
  paddle-ocr:
    enabled: true
    endpoint: ${DOCLENS_PADDLE_OCR_ENDPOINT:http://10.100.30.215:8080/ocr}
    timeout-seconds: 600
    visualize: false
    bootstrap-nodes:
      - name: paddle-215
        host: 10.100.30.215
        port: 8080
        enabled: true
        participate-global: true
        weight: 100
        max-concurrency: 4
  extraction:
    ocr-concurrency: 1
  pdf-render:
    dpi: 36
    image-format: png
  word-conversion:
    command: /opt/homebrew/bin/soffice
    timeout-seconds: 60
  callback:
    max-retries: 3
    timeout-seconds: 10
