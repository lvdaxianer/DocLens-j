spring:
  application:
    name: doclens-j
  datasource:
    url: jdbc:h2:file:./var/db/doclens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

doclens:
  storage-root: ./var/storage
  auto-process-on-upload: true
  worker-id: local-worker
  adapter:
    default-key: paddle_ocr
  paddle-ocr:
    enabled: true
    endpoint: http://127.0.0.1:8080/ocr
    timeout-seconds: 600
    visualize: false
  extraction:
    ocr-concurrency: 1
  pdf-render:
    dpi: 36
    image-format: png
  word-conversion:
    command: /opt/homebrew/bin/soffice
    timeout-seconds: 60
  callback:
    max-retries: 3
    timeout-seconds: 10
