spring:
  datasource:
    url: jdbc:h2:mem:doclens-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

doclens:
  storage-root: ./target/test-storage
  auto-process-on-upload: true
  worker-id: test-worker
  paddle-ocr:
    enabled: false
  traffic:
    enabled: false
    global-protection:
      enabled: false
